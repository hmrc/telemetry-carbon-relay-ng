[project]
name = "telemetry-carbon-relay-ng"
version = "1.0.0"
description = "A Docker image hosting carbon-relay-ng"
authors = [{ name = "Team Telemetry", email = "telemetry@digital.hmrc.gov.uk" }]
license = "Apache 2.0"
maintainers = [{ name = "Team Telemetry", email = "telemetry@digital.hmrc.gov.uk" }]
readme = "README.md"
requires-python = "==3.14.6"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = []

[dependency-groups]
dev = [
    "version-incrementor"
]

[tool.uv]
package = false
default-groups = "all"

[[tool.uv.index]]
name = "artifactory"
url = "https://artefacts.tax.service.gov.uk/artifactory/api/pypi/pips/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
